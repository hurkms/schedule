<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송기사 스케줄 현황</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        h1 { font-size: 1.5rem; color: #1e293b; }
        
        /* 관리자 입력 폼 */
        .admin-panel { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .admin-panel h3 { margin-bottom: 10px; font-size: 1rem; color: #475569; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-group input, .form-group select, .form-group button { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        .form-group input { flex: 1; min-width: 120px; }
        .btn-add { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-add:hover { background-color: #1d4ed8; }

        /* 필터 영역 */
        .filter-container { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .filter-container select { padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; }

        /* 스케줄 테이블 */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        
        /* 상태 태그 스타일 */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; display: inline-block; }
        .status-근무 { background-color: #dbeafe; color: #1e40af; }
        .status-대기 { background-color: #fef3c7; color: #92400e; }
        .status-휴무 { background-color: #fee2e2; color: #991b1b; }
        
        .btn-delete { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚛 배송기사 실시간 스케줄 현황</h1>
        </header>

        <div class="admin-panel">
            <h3>일정 등록 / 수정</h3>
            <div class="form-group">
                <input type="date" id="input-date">
                <input type="text" id="input-name" placeholder="기사명">
                <input type="text" id="input-area" placeholder="담당 구역">
                <select id="input-status">
                    <option value="근무">근무</option>
                    <option value="대기">대기</option>
                    <option value="휴무">휴무</option>
                </select>
                <button class="btn-add" onclick="addSchedule()">등록</button>
            </div>
        </div>

        <div class="filter-container">
            <select id="filter-status" onchange="renderSchedules()">
                <option value="전체">전체 보기</option>
                <option value="근무">근무만</option>
                <option value="대기">대기만</option>
                <option value="휴무">휴무만</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>기사명</th>
                    <th>담당 구역</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="schedule-tbody">
                <tr><td colspan="5" style="text-align: center;">실시간 데이터를 불러오는 중...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ 1단계에서 발급받은 본인의 Firebase 설정값으로 변경하세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let rawData = [];

        // 오늘 날짜 기본 세팅
        document.getElementById('input-date').value = new Date().toISOString().substring(0, 10);

        // Firestore 실시간 감지 (onSnapshot)
        // 누군가 데이터베이스를 수정하면 즉시 실행되어 화면을 바꿉니다.
        onSnapshot(collection(db, "schedules"), (snapshot) => {
            rawData = [];
            snapshot.forEach((doc) => {
                rawData.push({ id: doc.id, ...doc.data() });
            });
            // 날짜 오름차순 정렬
            rawData.sort((a, b) => new Date(a.date) - new Date(b.date));
            renderSchedules();
        });

        // 화면 렌더링 함수
        window.renderSchedules = function() {
            const filter = document.getElementById("filter-status").value;
            const tbody = document.getElementById("schedule-tbody");
            tbody.innerHTML = "";

            const filteredData = rawData.filter(item => filter === "전체" || item.status === filter);

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">등록된 일정이 없습니다.</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.date || '-'}</td>
                    <td><b>${item.name || '-'}</b></td>
                    <td>${item.area || '-'}</td>
                    <td><span class="badge status-${item.status}">${item.status}</span></td>
                    <td><button class="btn-delete" onclick="deleteSchedule('${item.id}')">삭제</button></td>
                `;
                tbody.appendChild(tr);
            });
        };

        // 일정 추가 함수
        window.addSchedule = async function() {
            const date = document.getElementById("input-date").value;
            const name = document.getElementById("input-name").value;
            const area = document.getElementById("input-area").value;
            const status = document.getElementById("input-status").value;

            if (!name || !area) {
                alert("기사명과 담당 구역을 입력해 주세요.");
                return;
            }

            try {
                await addDoc(collection(db, "schedules"), {
                    date, name, area, status,
                    createdAt: new Date()
                });
                // 입력 창 초기화
                document.getElementById("input-name").value = "";
                document.getElementById("input-area").value = "";
            } catch (e) {
                console.error("추가 실패: ", e);
                alert("일정 추가 중 오류가 발생했습니다.");
            }
        };

        // 일정 삭제 함수
        window.deleteSchedule = async function(id) {
            if (confirm("이 일정을 삭제하시겠습니까?")) {
                await deleteDoc(doc(db, "schedules", id));
            }
        };
    </script>
</body>
</html>
