<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송기사 스케줄 현황</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg-main: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 16px 12px; min-height: 100vh; }
        .app-container { max-width: 900px; margin: 0 auto; }

        header {
            background: var(--surface); padding: 16px 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background: #eff6ff; color: var(--primary); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .logo-text h1 { font-size: 1.15rem; font-weight: 700; }

        .filter-card {
            background: var(--surface); padding: 16px; border-radius: var(--radius);
            box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px;
        }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
        input, select { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.88rem; outline: none; background: #f8fafc; width: 100%; }

        .table-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
        th { background-color: #f8fafc; padding: 12px 16px; font-size: 0.8rem; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; font-size: 0.88rem; border-bottom: 1px solid var(--border); }

        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-working { background: var(--success-bg); color: var(--success); }
        .badge-standby { background: var(--warning-bg); color: var(--warning); }
        .badge-off { background: var(--danger-bg); color: var(--danger); }

        .no-data { text-align: center; padding: 30px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-truck-fast"></i></div>
                <div class="logo-text">
                    <h1>배송기사 스케줄 현황</h1>
                </div>
            </div>
            <button class="btn" onclick="fetchSchedules()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:600;">
                <i class="fa-solid fa-rotate"></i> 새로고침
            </button>
        </header>

        <div class="filter-card">
            <div class="filter-grid">
                <div class="form-group">
                    <label>날짜 검색</label>
                    <input type="date" id="filterDate" onchange="applyFilters()">
                </div>
                <div class="form-group">
                    <label>기사명 / 구역</label>
                    <input type="text" id="filterKeyword" placeholder="이름 또는 구역" oninput="applyFilters()">
                </div>
                <div class="form-group">
                    <label>근무 상태</label>
                    <select id="filterStatus" onchange="applyFilters()">
                        <option value="전체">전체 보기</option>
                        <option value="근무">근무만</option>
                        <option value="대기">대기만</option>
                        <option value="휴무">휴무만</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>기사명</th>
                            <th>담당 구역</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <tr><td colspan="4" class="no-data">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allSchedules = [];

        async function fetchSchedules() {
            try {
                // 타임스탬프(?t=시간)를 붙여 브라우저 캐시 방지
                const response = await fetch('./data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('데이터 불러오기 실패');
                
                allSchedules = await response.json();
                applyFilters();
            } catch (error) {
                document.getElementById('scheduleTableBody').innerHTML = 
                    '<tr><td colspan="4" class="no-data">스케줄 데이터를 불러올 수 없습니다.</td></tr>';
            }
        }

        function applyFilters() {
            const dateVal = document.getElementById('filterDate').value;
            const keywordVal = document.getElementById('filterKeyword').value.trim().toLowerCase();
            const statusVal = document.getElementById('filterStatus').value;

            const filtered = allSchedules.filter(item => {
                const matchDate = !dateVal || item.date === dateVal;
                const matchKeyword = !keywordVal || 
                    item.name.toLowerCase().includes(keywordVal) || 
                    item.area.toLowerCase().includes(keywordVal);
                const matchStatus = statusVal === '전체' || item.status === statusVal;

                return matchDate && matchKeyword && matchStatus;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('scheduleTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-data">조회된 스케줄이 없습니다.</td></tr>';
                return;
            }

            data.sort((a, b) => new Date(a.date) - new Date(b.date));

            data.forEach(item => {
                let badgeHTML = '';
                if (item.status === '근무') badgeHTML = `<span class="badge badge-working">근무</span>`;
                else if (item.status === '대기') badgeHTML = `<span class="badge badge-standby">대기</span>`;
                else badgeHTML = `<span class="badge badge-off">휴무</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.date}</strong></td>
                    <td>${item.name}</td>
                    <td>${item.area}</td>
                    <td>${badgeHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        fetchSchedules();
    </script>
</body>
</html>
