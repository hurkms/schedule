<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송기사 스케줄 현황</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        
        /* PK로지스틱스 스타일 배경 (물류 트럭 이미지 + 어두운 그라데이션) */
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat fixed;
            color: #334155; 
            padding: 12px;
            min-height: 100vh;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; padding: 15px 0 20px; }
        h1 { font-size: 1.4rem; color: #ffffff; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* 관리자 입력 폼 (글래스모피즘 & 카드 스타일) */
        .admin-panel { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(8px);
            padding: 16px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .admin-panel h3 { margin-bottom: 12px; font-size: 1rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .form-grid .full-width { grid-column: span 2; }
        
        .input-box { display: flex; flex-direction: column; gap: 4px; }
        .input-box label { font-size: 0.75rem; color: #475569; font-weight: 700; }
        .input-box input, .input-box select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; background: #ffffff; }
        .input-box input:focus, .input-box select:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }

        .btn-add { grid-column: span 2; margin-top: 6px; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(37,99,235,0.4); }
        .btn-add:active { background-color: #1d4ed8; }

        /* 필터 영역 */
        .filter-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .filter-container span { font-size: 0.85rem; color: #f8fafc; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .filter-container select { padding: 6px 10px; border-radius: 6px; border: none; background: rgba(255, 255, 255, 0.9); font-size: 0.85rem; font-weight: 500; }

        /* 카드형 스케줄 리스트 */
        .schedule-list { display: flex; flex-direction: column; gap: 10px; }
        .card { 
            background: rgba(255, 255, 255, 0.96); 
            backdrop-filter: blur(4px);
            border-radius: 12px; 
            padding: 14px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            border: 1px solid rgba(255,255,255,0.3); 
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed #e2e8f0; }
        .card-date { font-size: 0.8rem; color: #64748b; font-weight: 500; }
        
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .status-근무 { background-color: #dbeafe; color: #1e40af; }
        .status-대기 { background-color: #fef3c7; color: #92400e; }
        .status-휴무 { background-color: #fee2e2; color: #991b1b; }

        .card-main { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .driver-info { font-size: 1.1rem; font-weight: bold; color: #0f172a; }
        .route-info { font-size: 0.85rem; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .area-info { font-size: 0.85rem; color: #475569; margin-top: 2px; }

        .card-details { background: #f8fafc; padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; color: #334155; }
        .card-details div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .unit-price { font-size: 0.95rem; font-weight: bold; color: #16a34a; }
        .btn-delete { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-delete:active { background: #fca5a5; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚛 배송기사 스케줄 현황</h1>
        </header>

        <!-- 관리자 일정 추가 폼 -->
        <div class="admin-panel">
            <h3>일정 등록 / 수정</h3>
            <div class="form-grid">
                <div class="input-box">
                    <label>날짜</label>
                    <input type="date" id="input-date">
                </div>
                <div class="input-box">
                    <label>근무 상태</label>
                    <select id="input-status">
                        <option value="근무">근무</option>
                        <option value="대기">대기</option>
                        <option value="휴무">휴무</option>
                    </select>
                </div>
                <div class="input-box">
                    <label>기사명</label>
                    <input type="text" id="input-name" placeholder="홍길동">
                </div>
                <div class="input-box">
                    <label>라우트 번호</label>
                    <input type="text" id="input-route" placeholder="예: R-01">
                </div>
                <div class="input-box full-width">
                    <label>담당 구역</label>
                    <input type="text" id="input-area" placeholder="예: 강남구 역삼동">
                </div>
                <div class="input-box">
                    <label>단가 (원)</label>
                    <input type="number" id="input-price" placeholder="예: 150000">
                </div>
                <div class="input-box">
                    <label>계정 ID</label>
                    <input type="text" id="input-id" placeholder="아이디">
                </div>
                <div class="input-box full-width">
                    <label>비밀번호 (P/W)</label>
                    <input type="text" id="input-pw" placeholder="비밀번호">
                </div>
                <button class="btn-add" onclick="addSchedule()">일정 등록하기</button>
            </div>
        </div>

        <!-- 필터 영역 -->
        <div class="filter-container">
            <span id="total-count">총 0건</span>
            <select id="filter-status" onchange="renderSchedules()">
                <option value="전체">전체 보기</option>
                <option value="근무">근무만</option>
                <option value="대기">대기만</option>
                <option value="휴무">휴무만</option>
            </select>
        </div>

        <!-- 실시간 스케줄 카드 리스트 -->
        <div class="schedule-list" id="schedule-list">
            <div style="text-align: center; padding: 20px; color: #ffffff;">실시간 데이터를 불러오는 중...</div>
        </div>
    </div>

    <!-- Firebase SDK (v10 모듈) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ 기존에 발급받으신 본인의 Firebase 설정값으로 변경되어 있는지 확인하세요!
       const firebaseConfig = {
  apiKey: "AIzaSyDq2pOZ-94p0Y57TfHQvzzZTXRqoHOfkGI",
  authDomain: "schedulemanager-8b273.firebaseapp.com",
  projectId: "schedulemanager-8b273",
  storageBucket: "schedulemanager-8b273.firebasestorage.app",
  messagingSenderId: "804839729176",
  appId: "1:804839729176:web:8471cfe9ddfb258df1bb6d",
  measurementId: "G-K9G0JMQKTY"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let rawData = [];

        // 오늘 날짜 기본 세팅
        document.getElementById('input-date').value = new Date().toISOString().substring(0, 10);

        // Firestore 실시간 수신
        onSnapshot(collection(db, "schedules"), (snapshot) => {
            rawData = [];
            snapshot.forEach((doc) => {
                rawData.push({ id: doc.id, ...doc.data() });
            });
            rawData.sort((a, b) => new Date(a.date) - new Date(b.date));
            renderSchedules();
        });

        // 화면 렌더링 (카드 스타일)
        window.renderSchedules = function() {
            const filter = document.getElementById("filter-status").value;
            const container = document.getElementById("schedule-list");
            container.innerHTML = "";

            const filteredData = rawData.filter(item => filter === "전체" || item.status === filter);
            document.getElementById("total-count").innerText = `총 ${filteredData.length}건`;

            if (filteredData.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 30px; color: #64748b; background: rgba(255,255,255,0.95); border-radius: 12px;">등록된 일정이 없습니다.</div>';
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                
                const formattedPrice = item.price ? Number(item.price).toLocaleString() + '원' : '-';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-date">📅 ${item.date || '-'}</span>
                        <span class="badge status-${item.status}">${item.status}</span>
                    </div>
                    <div class="card-main">
                        <div>
                            <div class="driver-info">${item.name || '-'} 기사님</div>
                            <div class="area-info">📍 ${item.area || '-'}</div>
                        </div>
                        ${item.route ? `<span class="route-info">Route: ${item.route}</span>` : ''}
                    </div>
                    <div class="card-details">
                        <div><b>ID:</b> ${item.accountId || '-'}</div>
                        <div><b>P/W:</b> ${item.accountPw || '-'}</div>
                    </div>
                    <div class="card-footer">
                        <div class="unit-price">💰 ${formattedPrice}</div>
                        <button class="btn-delete" onclick="deleteSchedule('${item.id}')">삭제</button>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // 일정 추가
        window.addSchedule = async function() {
            const date = document.getElementById("input-date").value;
            const status = document.getElementById("input-status").value;
            const name = document.getElementById("input-name").value;
            const route = document.getElementById("input-route").value;
            const area = document.getElementById("input-area").value;
            const price = document.getElementById("input-price").value;
            const accountId = document.getElementById("input-id").value;
            const accountPw = document.getElementById("input-pw").value;

            if (!name) {
                alert("기사명을 입력해 주세요.");
                return;
            }

            try {
                await addDoc(collection(db, "schedules"), {
                    date, status, name, route, area, price, accountId, accountPw,
                    createdAt: new Date()
                });
                
                document.getElementById("input-name").value = "";
                document.getElementById("input-route").value = "";
                document.getElementById("input-area").value = "";
                document.getElementById("input-price").value = "";
                document.getElementById("input-id").value = "";
                document.getElementById("input-pw").value = "";
            } catch (e) {
                console.error("추가 실패: ", e);
                alert("일정 추가 중 오류가 발생했습니다.");
            }
        };

        // 일정 삭제
        window.deleteSchedule = async function(id) {
            if (confirm("이 일정을 삭제하시겠습니까?")) {
                await deleteDoc(doc(db, "schedules", id));
            }
        };
    </script>
</body>
</html>
